name: Synthetic fixture integration
on:
  pull_request:
    paths:
      - 'src/st_saca/**'
      - 'tests/**'
      - '.github/workflows/fixture-integration.yml'
  push:
    branches: ['test/synthetic-fixture-integration-v1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1]
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      WANDB_MODE: disabled
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - name: Dependency-free contract and regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install pinned official CPU test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --index-url https://pypi.org/simple numpy==1.26.4 scipy==1.16.3 matplotlib==3.10.7 pandas==2.3.3 tqdm==4.67.1 scikit-learn==1.7.2
      - name: Record dependency inventory
        run: python -m pip freeze
      - name: Run one synthetic seed without training
        run: timeout --signal=TERM --kill-after=10s 180s python -B tests/fixture_integration.py --seed ${{ matrix.seed }}
