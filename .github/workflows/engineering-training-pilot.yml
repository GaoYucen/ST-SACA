name: Engineering training pilot
on:
  pull_request:
    paths:
      - 'src/st_saca/**'
      - 'tools/engineering_training_pilot.py'
      - 'tests/test_engineering_training_contract.py'
      - 'docs/engineering-training-pilot-v1.md'
      - '.github/workflows/engineering-training-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      WANDB_MODE: disabled
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Contract and regression checks
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Official CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --index-url https://pypi.org/simple numpy==1.26.4 scipy==1.16.3 matplotlib==3.10.7 pandas==2.3.3 tqdm==4.67.1 scikit-learn==1.7.2
      - name: Exact tiny labels
        run: timeout --signal=TERM --kill-after=10s 180s python -I -B tools/engineering_training_pilot.py labels --out "$RUNNER_TEMP/st-pilot-labels"
      - name: Twenty router updates
        run: timeout --signal=TERM --kill-after=10s 300s python -I -B tools/engineering_training_pilot.py router --input "$RUNNER_TEMP/st-pilot-labels" --out "$RUNNER_TEMP/st-pilot-router"
      - name: One SAC update per method at seed0
        run: timeout --signal=TERM --kill-after=10s 180s python -I -B tools/engineering_training_pilot.py sac --seed 0 --input "$RUNNER_TEMP/st-pilot-router" --out "$RUNNER_TEMP/st-pilot-sac0"
      - name: One SAC update per method at seed1
        run: timeout --signal=TERM --kill-after=10s 180s python -I -B tools/engineering_training_pilot.py sac --seed 1 --input "$RUNNER_TEMP/st-pilot-router" --out "$RUNNER_TEMP/st-pilot-sac1"
